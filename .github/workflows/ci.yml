name: CI

# Run the quality gate on every pull request targeting main, and on pushes to
# main itself (so the trunk is always verified after a merge). Each job mirrors
# the checks run locally: ruff, black --check, mypy, and pytest.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. a new push to a PR branch) so we
# don't waste minutes on stale commits.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, type-check, and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Create virtual environment
        run: uv venv

      - name: Install project with dev dependencies
        run: uv pip install -e '.[dev]'

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Black (format check)
        run: uv run black --check .

      - name: Mypy (type check)
        run: uv run mypy src

      - name: Pytest (tests)
        run: uv run pytest -q
